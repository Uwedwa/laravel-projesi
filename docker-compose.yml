services:
  proje:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./src:/var/www/html
      - ./etc/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - laravel-network

  web:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./etc/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - proje
    networks:
      - laravel-network

  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel_projem
      MYSQL_USER: enes
      MYSQL_PASSWORD: enes123
    volumes:
      - db-data:/var/lib/mysql
      - ./etc/mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - laravel-network

  redis:
    image: redis:alpine
    restart: always
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge

volumes:
  db-data
